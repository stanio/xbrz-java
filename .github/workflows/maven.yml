# https://docs.github.com/en/actions/tutorials/build-and-test-code/java-with-maven
name: Maven Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    #inputs:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn --batch-mode --show-version --no-transfer-progress verify -P release -Dgpg.skip=true

    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@v6
